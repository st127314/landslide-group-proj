name: CI/CD

# test -> build containers -> push to GHCR -> deploy to the AWS server over SSH.
# The deploy job is OFF until the repository variable DEPLOY_ENABLED is set to "true".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    name: Backend + pipeline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements*.txt
      - run: pip install -r apps/backend/requirements.txt -r apps/backend/requirements-dev.txt
      - name: API tests (synthetic fixtures; no private data needed)
        run: python -m pytest apps/backend/tests -q
      - name: Pipeline unit tests (skipped here because the private scripts are not in this repo)
        run: python -m unittest discover -s tests -v

  test-frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build   # includes the TypeScript check
        env:
          NEXT_PUBLIC_API_URL: ""
          NEXT_TELEMETRY_DISABLED: "1"

  build-images:
    name: Build & push images
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/landslide-backend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/landslide-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/landslide-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/landslide-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to AWS
    # Set the repository variable DEPLOY_ENABLED=true (Settings > Secrets and variables > Actions > Variables) to switch on.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: build-images
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      SSH_OPTS: -i /home/runner/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload deploy files
        run: |
          ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" 'mkdir -p /opt/landslide/traefik /opt/landslide/nginx'
          scp $SSH_OPTS apps/deploy/docker-compose.yml apps/deploy/deploy.sh apps/deploy/enable-https.sh apps/deploy/install-nginx-site.sh "$EC2_USER@$EC2_HOST":/opt/landslide/
          scp $SSH_OPTS apps/deploy/traefik/landslide.yml "$EC2_USER@$EC2_HOST":/opt/landslide/traefik/
          scp $SSH_OPTS apps/deploy/nginx/landslide-host.conf.template "$EC2_USER@$EC2_HOST":/opt/landslide/nginx/
      - name: Pull images and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build-images.outputs.tag }}
          GHCR_OWNER: ${{ needs.build-images.outputs.owner }}
        run: |
          # The job token is short-lived and only lets the server pull this repo's images.
          printf '%s' "$GHCR_TOKEN" | ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" "chmod +x /opt/landslide/*.sh && IMAGE_TAG='$IMAGE_TAG' GHCR_OWNER='$GHCR_OWNER' /opt/landslide/deploy.sh"
      - name: Smoke test through Traefik (on the server)
        run: |
          ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" 'set -a; . /opt/landslide/.env.local; set +a; curl -fsS -H "Host: ${DOMAIN:-landslide.spadace.com}" "http://127.0.0.1:${TRAEFIK_PORT:-8088}/api/health"'
      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
